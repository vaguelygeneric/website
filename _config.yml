title: "Vaguely Generic"
tagline: "An online presence about nothing specific."
description: "Vaguely Generic is a presence that exists to do whatever."
baseurl: ""
url: "https://vaguelygeneric.website"
timezone: "UTC"
email: "email@vaguelygeneric.website"
# YouTube
youtube_channel: "https://www.youtube.com/@VaguelyGeneric"

# Collections
collections:
  shows:
    output: true
    permalink: /podcast/:slug/
  podcast:
    output: true
    permalink: /podcast/:path/
  posts:
    output: true
    permalink: /blog/:year/:month/:day/:title/
  people:
    output: true
    permalink: /person/:slug/
  comics:
    output: true
    permalink: /comics/:slug/
  comic:
    output: true
    permalink: /comics/:path/
  stories:
    output: true
    permalink: /story/:slug/
  story:
    output: true
    permalink: /story/:path/

defaults:
  - scope:
      path: ""
      type: "shows"
    values:
      layout: "show"
  - scope:
      path: ""
      type: "podcast"
    values:
      layout: "episode"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "people"
    values:
      layout: "person"
  - scope:
      path: ""
      type: "stories"
    values:
      layout: "story"
  - scope:
      path: ""
      type: "story"
    values:
      layout: "story-chapter"
  - scope:
      path: ""
      type: "comics"
    values:
      layout: "comic"
  - scope:
      path: ""
      type: "comic"
    values:
      layout: "comic-strip"

# Build settings
markdown: kramdown
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# Nothing on the site reads page/document .excerpt (checked: no template
# references it). Disabling it stops Jekyll's default excerpt_separator
# ("\n\n") from scanning raw content for a blank line to cut at, which
# otherwise trips a "Excerpt modified ... Liquid block containing the
# excerpt separator" warning on any {% poem %}/{% endpoem %} block whose
# body has stanza breaks -- Jekyll doesn't know the blank line is inside
# an open Liquid block until it's already tried to split on it.
excerpt_separator: ""

permalink: /:categories/:year/:month/:day/:title/

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - README.md
  - Dockerfile
  - tools
  - temp