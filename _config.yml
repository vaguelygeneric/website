title: "Vaguely Generic"
tagline: "An online presence about nothing specific."
description: "Vaguely Generic is a presence that exists to do whatever."
baseurl: ""
url: "https://vaguelygeneric.website"
timezone: "UTC"
email: "email@vaguelygeneric.website"
# YouTube
youtube_channel: "https://www.youtube.com/@VaguelyGeneric"

# Collections
collections:
  shows:
    output: true
    permalink: /podcast/:slug/
  podcast:
    output: true
    permalink: /podcast/:path/
  posts:
    output: true
    permalink: /blog/:year/:month/:day/:title/
  guests:
    output: true
    permalink: /guests/:slug/
  comics:
    output: true
    permalink: /comics/:slug/
  comic:
    output: true
    permalink: /comics/:path/
  stories:
    output: true
    permalink: /stories/:slug/
  story:
    output: true
    permalink: /stories/:path/

defaults:
  - scope:
      path: ""
      type: "shows"
    values:
      layout: "show"
  - scope:
      path: ""
      type: "podcast"
    values:
      layout: "episode"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "guests"
    values:
      layout: "guest"
  - scope:
      path: ""
      type: "comics"
    values:
      layout: "comic"
  - scope:
      path: ""
      type: "comic"
    values:
      layout: "comic-strip"
  - scope:
      path: ""
      type: "stories"
    values:
      layout: "story"
  - scope:
      path: ""
      type: "story"
    values:
      layout: "story-chapter"

# Build settings
markdown: kramdown
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

permalink: /:categories/:year/:month/:day/:title/

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - README.md
  - Dockerfile
  - tools
  - temp